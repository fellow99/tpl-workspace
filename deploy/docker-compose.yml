# ============================================================
# tpl-workspace Docker Compose 部署编排
# 
# 服务清单:
#   1. postgres      - PostgreSQL 18 数据库
#   2. redis         - Redis 8 缓存服务
#   3. tpl-manage     - 管理后台 Spring Boot 服务 (端口 8081)
#   4. tpl-manage-ui  - 管理后台前端 Vue SPA (内部端口 80)
#   5. tpl-app-api    - 核心业务 Spring Boot 服务 (端口 8082)
#   6. tpl-app-web    - 用户端 Vue SPA (内部端口 80)
#   7. nginx         - 总网关反向代理 (端口 80)
# 
# 使用方式:
#   docker compose -f deploy/docker-compose.yml up --build -d
# ============================================================

name: tpl-app

services:
  # ============================================================
  # PostgreSQL 18 数据库服务
  # ============================================================
  postgres:
    image: postgres:18-alpine
    container_name: tpl-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${POSTGRES_DB:-tpl_manage}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "35432:5432"
    volumes:
      # 数据库初始化脚本 (首次启动时自动执行，按依赖顺序加载)
      - ./sql:/docker-entrypoint-initdb.d:ro
      # 数据持久化
      - pgdata:/var/lib/postgresql
    networks:
      - tpl-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================================
  # Redis 8 缓存服务
  # ============================================================
  redis:
    image: redis:8-alpine
    container_name: tpl-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-postgres} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      TZ: Asia/Shanghai
    ports:
      - "36379:6379"
    volumes:
      - redisdata:/data
    networks:
      - tpl-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-postgres}", "--no-auth-warning", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # tpl-manage 后端服务 (Spring Boot)
  # ============================================================
  tpl-manage:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.tpl-manage
    image: fellow99/tpl-manage:latest
    container_name: tpl-manage
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: docker
      # JVM 内存限制 (适配容器)
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+UseZGC"
      # 密钥/密码（deploy/.env 注入）
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-postgres}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      SA_TOKEN_JWT_SECRET: ${SA_TOKEN_JWT_SECRET:-changeMe}
      DB_URL: ${DB_URL_MANAGE:-}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    ports:
      - "38081:8081"
    volumes:
      - tpl-manage-logs:/app/logs
    networks:
      - tpl-network
    # 健康检查由 Dockerfile 中的 HEALTHCHECK 定义

  # ============================================================
  # tpl-manage-ui 前端服务 (Vue SPA - Nginx)
  # ============================================================
  tpl-manage-ui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.tpl-manage-ui
    image: fellow99/tpl-manage-ui:latest
    container_name: tpl-manage-ui
    restart: unless-stopped
    depends_on:
      - tpl-manage
    environment:
      TZ: Asia/Shanghai
    networks:
      - tpl-network
    # 健康检查由 Dockerfile 中的 HEALTHCHECK 定义

  # ============================================================
  # tpl-app-api 核心业务后端服务 (Spring Boot)
  # ============================================================
  tpl-app-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.tpl-app-api
    image: fellow99/tpl-app-api:latest
    container_name: tpl-app-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -Xss512k"
      # 密钥/密码（deploy/.env 注入）
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-postgres}
      SA_TOKEN_JWT_SECRET: ${SA_TOKEN_JWT_SECRET:-changeMe}
      RSA_PRIVATE_KEY: ${RSA_PRIVATE_KEY:-}
      DB_URL: ${DB_URL:-}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SMS_BASE_URL: ${SMS_BASE_URL:-https://push.spug.cc}
      SMS_TEMPLATE_CODE: ${SMS_TEMPLATE_CODE:-}
      # 微信登录（默认启用；AppID/Secret 由 deploy/.env 注入，留空则该端登录不可用）
      WECHAT_LOGIN_ENABLED: ${WECHAT_LOGIN_ENABLED:-true}
      WECHAT_WEB_APPID: ${WECHAT_WEB_APPID:-}
      WECHAT_WEB_SECRET: ${WECHAT_WEB_SECRET:-}
      WECHAT_WEB_REDIRECT_URI: ${WECHAT_WEB_REDIRECT_URI:-}
      WECHAT_APP_APPID: ${WECHAT_APP_APPID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_XCX_APPID: ${WECHAT_XCX_APPID:-}
      WECHAT_XCX_SECRET: ${WECHAT_XCX_SECRET:-}
    ports:
      - "38082:8082"
    volumes:
      - tpl-app-api-logs:/app/logs
    networks:
      - tpl-network
    # 健康检查由 Dockerfile 中的 HEALTHCHECK 定义

  # ============================================================
  # tpl-app-web 用户端前端服务 (Vue SPA - Nginx)
  # ============================================================
  tpl-app-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.tpl-app-web
    image: fellow99/tpl-app-web:latest
    container_name: tpl-app-web
    restart: unless-stopped
    depends_on:
      - tpl-app-api
    environment:
      TZ: Asia/Shanghai
    networks:
      - tpl-network
    # 健康检查由 Dockerfile 中的 HEALTHCHECK 定义

  # ============================================================
  # tpl-website 介绍官网 (纯静态 - Nginx)
  # ============================================================
  tpl-website:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.tpl-website
    image: fellow99/tpl-website:latest
    container_name: tpl-website
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    networks:
      - tpl-network
    # 健康检查由 Dockerfile 中的 HEALTHCHECK 定义

  # ============================================================
  # Nginx 总网关 (反向代理)
  # ============================================================
  nginx:
    image: nginx:latest
    container_name: tpl-nginx
    restart: unless-stopped
    depends_on:
      tpl-manage:
        condition: service_started
      tpl-manage-ui:
        condition: service_started
      tpl-app-api:
        condition: service_started
      tpl-app-web:
        condition: service_started
      tpl-website:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
    ports:
      - "38088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    networks:
      - tpl-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# ============================================================
# 数据卷定义
# ============================================================
volumes:
  pgdata:
    name: tpl-manage-pgdata
    driver: local
  redisdata:
    name: tpl-manage-redisdata
    driver: local
  tpl-manage-logs:
    name: tpl-manage-logs
    driver: local
  tpl-app-api-logs:
    name: tpl-app-api-logs
    driver: local
  nginx-logs:
    name: tpl-manage-nginx-logs
    driver: local

# ============================================================
# 网络定义
# ============================================================
networks:
  tpl-network:
    name: tpl-manage-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
