# ============================================================
# tpl-app-web 容器内部 Nginx 配置
# 职责：作为 SPA 静态文件服务器，处理 Vue Router history 模式
# ============================================================

server {
    listen       80;
    server_name  localhost;
    charset      utf-8;

    root   /usr/share/nginx/html;
    index  index.html;

    access_log  /var/log/nginx/access.log  combined buffer=32k flush=5s;
    error_log   /var/log/nginx/error.log   warn;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;
    gzip_vary on;
    gzip_disable "msie6";

    # 静态资源缓存 (带 hash 的文件名长期缓存)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # 图标 / 图片
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # 字体文件
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    # SPA fallback - Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header X-XSS-Protection "1; mode=block";
    }

    # 安全：禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
