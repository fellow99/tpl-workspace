# ============================================================
# tpl-workspace Nginx 总网关配置
# 职责：反向代理，路由分发
#   - /web/            → tpl-app-web (用户端 SPA)
#   - /manage/         → tpl-manage-ui (管理后台 SPA)
#   - /dev-api/        → tpl-manage (管理后端 API)
#   - /prod-api/       → tpl-manage (管理后端 API)
#   - /api/            → tpl-app-api (核心业务 API)
#   - /auth/           → tpl-app-api (认证接口)
#   - /admin/          → Spring Boot Admin (预留)
#   - /                → tpl-website (介绍官网，根路径)
# ============================================================

upstream tpl-manage-backend {
    server tpl-manage:8081 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream tpl-manage-frontend {
    server tpl-manage-ui:80 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream tpl-app-api-backend {
    server tpl-app-api:8082 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream tpl-app-web-frontend {
    server tpl-app-web:80 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream tpl-website-frontend {
    server tpl-website:80 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen       80;
    server_name  localhost;
    charset      utf-8;

    access_log  /var/log/nginx/access.log  combined buffer=32k flush=5s;
    error_log   /var/log/nginx/error.log   warn;

    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml application/xml+rss image/svg+xml;
    gzip_vary on;
    gzip_disable "msie6";

    # ============================================================
    # 管理后台 SPA (tpl-manage-ui)
    # ============================================================

    location /manage/ {
        rewrite ^/manage/?(.*)$ /$1 break;
        proxy_pass http://tpl-manage-frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ============================================================
    # 核心业务 API (tpl-app-api) — 用户端接口
    # ============================================================

    location /api/ {
        proxy_pass http://tpl-app-api-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /auth/ {
        proxy_pass http://tpl-app-api-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 短信验证码发送接口
    location /resource/ {
        proxy_pass http://tpl-app-api-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 用户信息接口（getInfo / profile / password）
    location /system/ {
        proxy_pass http://tpl-app-api-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ============================================================
    # 管理后台 API (tpl-manage)
    # ============================================================

    location /dev-api/ {
        rewrite ^/dev-api/(.*)$ /$1 break;
        proxy_pass http://tpl-manage-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /prod-api/ {
        rewrite ^/prod-api/(.*)$ /$1 break;
        proxy_pass http://tpl-manage-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://tpl-manage-backend/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /actuator/ {
        proxy_pass http://tpl-manage-backend/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        allow 172.0.0.0/8;
        allow 127.0.0.1;
        deny all;
    }

    # ============================================================
    # 用户端 SPA (tpl-app-web)
    # ============================================================

    location /web/ {
        rewrite ^/web/?(.*)$ /$1 break;
        proxy_pass http://tpl-app-web-frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ============================================================
    # 介绍官网 (tpl-website) —— 根路径 + 静态资源兜底
    # 前缀匹配作为最后兜底：/web/、/manage/、/api/ 等更长前缀优先命中
    # ============================================================

    location / {
        proxy_pass http://tpl-website-frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
