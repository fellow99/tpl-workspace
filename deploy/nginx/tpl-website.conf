# ============================================================
# tpl-website 容器内部 Nginx 配置
# 职责：作为静态官网服务器，提供 tpl-workspace 介绍官网
# 纯静态资源（HTML/CSS/JS/SVG），无构建、无 SPA fallback
# ============================================================

server {
    listen       80;
    server_name  localhost;
    charset      utf-8;

    root   /usr/share/nginx/html;
    index  index.html;

    access_log  /var/log/nginx/access.log  combined buffer=32k flush=5s;
    error_log   /var/log/nginx/error.log   warn;

    # Gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;
    gzip_vary on;
    gzip_disable "msie6";

    # 静态资源缓存（无 hash 文件名，采用较保守的缓存时长）
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
    }

    # 图标 / 图片
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
    }

    # HTML 入口不缓存（便于更新即时生效）
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    # 默认：返回请求文件，缺失则 404
    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # 安全：禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
